# ============================================================
# E14.L2-Allow — runtime chain-hash determinism (canonical bytes + WAL chain)
# ============================================================
[E14_L2_Allow]
tier = "MC"
axiom = "Runtime chain-hash determinism: canonical Component/Event postcard bytes + WAL chain verification (ChainHashDeterministic)"
tla_invs = ["ChainHashDeterministic"]
tla_module = "../ArkheKernel/formal/tla-plus/cr1_chain_hash_invariant.tla"
impl_tests = [
    # ChainHashDeterministic
    # INV implementation witnesses in arkhe-kernel/src/persist/wal.rs.
    # Explicit ChainBroken path coverage (verify_chain_detects_broken_
    # prev_link) plus retro-registration of existing verify_chain* tests
    # that witness the same INV (inventory gap absorb).
    "verify_chain_detects_broken_prev_link",
    "verify_chain_against_wrong_world_id_fails",
    "verify_chain_validates_signatures",
    # Layer A item 1
    # (DOMAIN_CTX literal) byte-level formal anchor. The chain key is
    # derived via blake3::derive_key(DOMAIN_CTX, world_id) — DOMAIN_CTX
    # byte identity is the upstream precondition of ChainHashDeterministic
    # (every WAL chain ever produced is keyed with these bytes; one byte
    # change rederives every chain key). Frozen-hex BLAKE3 regression
    # witness pins the literal at the byte level (A1/A14).
    "domain_ctx_byte_identity_blake3",
    # Layer A item 3 (Principal+KernelEvent+StepStage derives via
    # arkhe-macros) `silent_ast_risk` ("canonical bytes mutation =
    # potential A1 bit-identical replay violation") direct closure.
    # Pins the postcard wire bytes for ArkheComponent + ArkheEvent
    # derive emission via synthetic test fixtures. Component/Event
    # canonical_bytes feed into WalRecord.action_bytes (chain hash
    # upstream) — a postcard re-encoding shift breaks these assertions
    # before the divergence reaches a chain hash mismatch (A1 + A14
    # subset coverage; full Layer A item 3 protection in
    # `[layer_a_items.item_3]`). Dual-witness: byte-identity (rewrite
    # catch) + parse-back (silent edit catch).
    "component_canonical_bytes_pinned",
    "event_canonical_bytes_pinned",
]
impl_paths = [
    # ChainHashDeterministic INV witness scope (wal.rs verify_chain*
    # tests) in the kernel persist layer.
    "../ArkheKernel/arkhe-kernel/src/persist/wal.rs",
    # arkhe-macros derive emission canonical_bytes byte-identity
    # witnesses (component_canonical_bytes_pinned +
    # event_canonical_bytes_pinned) live in the kernel's integration
    # test surface (consumed via the same `::arkhe_kernel::...` paths
    # an external domain crate would use).
    "../ArkheKernel/arkhe-kernel/tests/derive_macros.rs",
]

