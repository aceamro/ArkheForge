[package]
name          = "arkhe-subset-rust-check"
version       = "0.14.1"
edition       = "2021"
rust-version.workspace = true
description   = "Lint helpers for ArkheForge Runtime: enforces Subset-Rust purity on Action::compute (clock / RNG / I/O / FFI deny-list). Backs the #[arkhe_pure] attribute macro per E14.L1."
keywords      = ["lint", "purity", "determinism", "arkhe", "subset-rust"]
categories    = ["development-tools", "development-tools::testing"]
repository    = "https://github.com/aceamro/ArkheForge"
homepage      = "https://github.com/aceamro/ArkheForge"
documentation = "https://docs.rs/arkhe-subset-rust-check"
license       = "MIT OR Apache-2.0"
readme        = "README.md"
authors       = ["Arkhe Contributors"]
publish       = true

[lib]
# Regular syn-based lib on the workspace stable toolchain pin (1.80) —
# matches the pattern in arkhe-trait-default-check. The dylint cdylib
# + driver alternative is described in lib.rs rustdoc; the regular
# lib path is preferred here because dylint requires nightly and the
# workspace stable pin would have to bifurcate.
crate-type = ["lib"]

[dependencies]
syn         = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
quote       = "1"

[lints]
workspace = true
