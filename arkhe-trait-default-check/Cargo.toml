[package]
name          = "arkhe-trait-default-check"
version       = "0.14.1"
edition       = "2021"
rust-version.workspace = true
description   = "Lint crate for ArkheForge Runtime: detects semantic changes to trait default-method bodies via AST fingerprinting. Enforces the Minor-1 breaking-change rule in CI."
keywords      = ["lint", "trait", "stability", "fingerprint", "arkhe"]
categories    = ["development-tools", "development-tools::testing"]
repository    = "https://github.com/aceamro/ArkheForge"
homepage      = "https://github.com/aceamro/ArkheForge"
documentation = "https://docs.rs/arkhe-trait-default-check"
license       = "MIT OR Apache-2.0"
readme        = "README.md"
authors       = ["Arkhe Contributors"]
publish       = false

[lib]
# AST fingerprint helpers ship as a regular lib. The dylint cdylib +
# driver alternative (lint fires via `cargo dylint`) is described in
# src/lib.rs rustdoc; the regular lib path is preferred because dylint
# requires nightly while the workspace toolchain is pinned to stable.
crate-type = ["lib"]

[dependencies]
syn        = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
quote      = "1"
blake3     = { workspace = true }

[lints]
workspace = true
